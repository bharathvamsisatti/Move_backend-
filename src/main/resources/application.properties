spring.application.name=carpooling
server.port=8080

# ===========================
# DATABASE (AWS RDS / EC2 MySQL)
# ===========================
spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/move_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ===========================
# FILE UPLOAD
# ===========================
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ===========================
# JWT
# ===========================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ===========================
# GOOGLE OAUTH
# ===========================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI}

spring.security.oauth2.client.provider.google.issuer-uri=https://accounts.google.com

# ===========================
# MAIL
# ===========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===========================
# TESSERACT (LINUX)
# ===========================
tesseract.path=/usr/bin/tesseract
tesseract.language=eng

# ===========================
# CORS
# ===========================
spring.web.cors.allowed-origins=${FRONTEND_URL}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# ===========================
# FRONTEND
# ===========================
app.frontend-url=${FRONTEND_URL}

# ===========================
# PROXY (FOR HTTPS)
# ===========================
server.forward-headers-strategy=framework
server.use-forward-headers=true
